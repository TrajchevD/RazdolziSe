<div class="auth-card">
  @if (!codeSent()) {
    <h1>Reset password</h1>

    <form (ngSubmit)="requestCode()">
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Sending…' : 'Send reset code' }}
      </button>
    </form>

    <p>If that email has an account, we'll send a code to reset the password.</p>
  } @else {
    <h1>Enter your code</h1>

    <form (ngSubmit)="resetPassword()">
      <label>
        Verification code
        <input type="text" name="code" [(ngModel)]="code" required inputmode="numeric" maxlength="6" />
      </label>

      <label>
        New password
        <div class="password-field">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            minlength="8"
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Resetting…' : 'Reset password' }}
      </button>
      <button type="button" class="link-button" [disabled]="isSubmitting()" (click)="requestCode()">
        Resend code
      </button>
    </form>
  }

  <p>Remembered it? <a routerLink="/login">Log in</a></p>
</div>
