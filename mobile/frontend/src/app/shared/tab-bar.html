<nav class="tab-bar" aria-label="Primary">
  <a routerLink="/home" (click)="onTabTap('/home')" class="tab" [class.active]="activeTab() === '/home'">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 4l8 7.5" />
        <path d="M6 10v9h12v-9" />
      </svg>
    </span>
    <span class="tab-label">Home</span>
  </a>

  <a routerLink="/trips" (click)="onTabTap('/trips')" class="tab" [class.active]="activeTab() === '/trips'">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="8" width="16" height="12" rx="3" />
        <path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
    </span>
    <span class="tab-label">Trips</span>
  </a>

  <a routerLink="/friends" (click)="onTabTap('/friends')" class="tab" [class.active]="activeTab() === '/friends'">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.25" />
        <path d="M3.5 19c0.9-3 3-4.75 5.5-4.75s4.6 1.75 5.5 4.75" />
        <path d="M16 9.25a2.75 2.75 0 1 0 0-5.5" />
        <path d="M15 14.5c2.1 0.35 3.6 1.8 4.4 4.5" />
      </svg>
      @if (requestCount() > 0) {
        <span class="tab-badge">{{ requestCount() }}</span>
      }
    </span>
    <span class="tab-label">Friends</span>
  </a>

  <a routerLink="/analytics" (click)="onTabTap('/analytics')" class="tab" [class.active]="activeTab() === '/analytics'">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10" />
        <path d="M11 20V4" />
        <path d="M18 20v-7" />
      </svg>
    </span>
    <span class="tab-label">Analytics</span>
  </a>

  <a routerLink="/profile" (click)="onTabTap('/profile')" class="tab" [class.active]="activeTab() === '/profile'">
    <span class="tab-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5" />
        <path d="M5 20c1.1-3.5 3.7-5.5 7-5.5s5.9 2 7 5.5" />
      </svg>
    </span>
    <span class="tab-label">Profile</span>
  </a>
</nav>
