<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RazdolziSe</title>
  <base href="/">
  <!-- viewport-fit=cover + the safe-area CSS vars in styles.scss are what let the app draw
       edge-to-edge under the iOS notch/Android status bar instead of leaving a dead grey
       bar the OS would otherwise paint there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#20180f" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Organic design system voice: Caprasimo for display headings, Figtree for body —
       see PRODUCTION_REVIEW.md / the imported Tally design for why these two. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <!-- TODO once real branding exists: add manifest.json + apple-touch-icon + real
       app icons (see MOBILE_SETUP.md) — this only covers the native-shell case. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
